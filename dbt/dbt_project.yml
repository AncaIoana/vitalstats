name: 'vitalstats'
version: '1.0.0'
config-version: 2

profile: 'vitalstats'

model-paths: [ "models" ]
test-paths: [ "tests" ]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  vitalstats:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
